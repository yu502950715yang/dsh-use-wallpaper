[package]
name = "we-scene-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
# wgpu 在 Task 5 引入；本任务保持解析模块无 wgpu 依赖
