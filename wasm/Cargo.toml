[package]
name = "we-scene-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# CPU 粒子模拟的 wasm 导出（`CpuParticleSim`）：`vertices()` 返回 Float32Array，需要 js-sys。
# three.js 播放器路径用；native `cargo test` 不开本 feature（只跑解析与模拟的纯逻辑）。
# 2026-09-22：本 feature 原名叫 `render`，当时还含 wgpu/WebGPU 渲染器 —— 该渲染器与
# `scene.rs`/`tex.rs`、naga、spirv-webgpu-transform、lz4_flex、png、jpeg-decoder、bytemuck
# 等依赖已一并删除，名字改为诚实的 `cpu-sim`。
cpu-sim = ["dep:js-sys"]

[dependencies]
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = { version = "0.3", optional = true }

[package.metadata.wasm-pack.profile.release]
# wasm-opt（binaryen）在本机沙箱下因权限拒绝（os error 5），且项目无需手工优化
# （产物已由 wasm-bindgen 输出）。禁用后 wasm-pack 不再调用 wasm-opt。
wasm-opt = false
