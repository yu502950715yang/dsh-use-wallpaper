name: CI

# 三个门禁（设计见 docs/superpowers/specs/2026-09-22-e2e-harness-and-ci-design.md）：
#   typecheck — tsc strict + **产物新鲜度**：lib/ 是入库的 tsc 产物，必须与 src 同步
#   test      — vitest + 已知失败基线集合差（只对**新增**失败判红，见 AGENT.md §7.11）
#   e2e       — 真实 headless Edge 渲染并逐像素判定（SwiftShader 档，**不需要 GPU**）
#
# 平台一律 windows-latest：项目 README 声明「仅 Windows 实测」，Linux 行为未验证，
# 用 ubuntu 会引入无法在本机复现的失败面。dist/ 无法在 CI 重建（依赖被 gitignore 的
# wasm/pkg/，需 Rust wasm 工具链），故产物守卫只覆盖 lib/。
#
# ⚠️ 动作主版本必须跑在 **Node 24 运行时**上：GitHub 自 2026-06-16 起把 JS 动作的默认运行时换成
# Node24，并于 **2026-09-23 彻底移除 Node20**（`ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION` 也不再可用，
# 见 github.blog 的两条 changelog）。跑在 node20 上的动作（checkout@v4 / setup-node@v4 /
# upload-artifact@v4 / pnpm/action-setup@v5）会**直接失败**，且失败点在 `setup-node` 内部、与仓库代码无关。
# 现行钉法：checkout@v5 / setup-node@v5 / upload-artifact@v6 / pnpm/action-setup@v5 ——
# 除 upload-artifact 外都取「首个 node24 主版本」，避免跨多个大版本。
# 验证方式：`curl -s https://raw.githubusercontent.com/<owner>/<repo>/<tag>/action.yml | grep using`。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc（strict）
        run: npx tsc -p tsconfig.json --noEmit
      - name: lib/ 产物必须与 src 同步（重跑 tsc 后零差异）
        run: |
          npx tsc -p tsconfig.json
          git diff --exit-code lib/
        shell: bash

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest（产出 JSON 报告）
        run: npx vitest run --reporter=json --outputFile=.vitest-report.json
        continue-on-error: true
      - name: 只对新增失败判红
        run: node scripts/check-known-failures.mjs .vitest-report.json

  e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ⚠️ GitHub 的 windows-latest 镜像**没有预装 Edge**（只有 Chrome），而本项目只声明支持
      # Windows/Edge ⇒ 必须自己装。此前这步是「找不到就 throw」，从第一次运行起就一直失败。
      # setup-edge@v1 自身跑在 node24 上（已核 action.yml），输出 edge-path 直接喂给 EDGE_PATH。
      - name: 安装 Edge（实测渲染 e2e 用）
        id: edge
        uses: browser-actions/setup-edge@v1
      - name: 确认 Edge 可用（兜底探测并复核 EDGE_PATH）
        run: |
          $candidates = @(
            $env:EDGE_PATH,
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $edge = $candidates | Select-Object -First 1
          if (-not $edge) { $edge = (Get-Command msedge.exe -ErrorAction SilentlyContinue).Source }
          if (-not $edge) { throw "找不到 Edge，e2e 无法运行（setup-edge 也没装上）" }
          $ver = (Get-Item $edge).VersionInfo.ProductVersion
          Write-Host "Edge: $edge (version $ver)"
          "EDGE_PATH=$edge" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        shell: pwsh
      - name: colorBlendMode 渲染 e2e（逐像素判据）
        run: node e2e/verify/verify-colorblend.mjs
      - name: 上传截图（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-shots
          path: e2e/.out/
          if-no-files-found: ignore
